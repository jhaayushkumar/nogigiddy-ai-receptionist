<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>NoGigiddy AI Receptionist</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family: Arial, Helvetica, sans-serif;

      background: #f5f7fb;
    }

    .container {
      width: 90%;
      max-width: 650px;

      padding: 50px 30px;

      text-align: center;

      background: white;

      border-radius: 20px;

      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
    }

    .logo {
      font-size: 18px;
      font-weight: bold;

      margin-bottom: 30px;
    }

    h1 {
      margin: 0 0 15px;

      font-size: 36px;
    }

    .description {
      max-width: 500px;

      margin: 0 auto 30px;

      color: #666;

      line-height: 1.6;
    }

    .notice {
      margin-top: 25px;

      font-size: 13px;

      color: #888;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="logo">
      NoGigiddy
    </div>

    <h1>
      AI Virtual Receptionist
    </h1>

    <p class="description">
      Talk with our AI virtual receptionist and experience
      automated call handling.
    </p>

    <vapi-widget
      public-key=""
      assistant-id=""
      mode="voice">
    </vapi-widget>

    <p class="notice">
      Click the button above to start a conversation.
    </p>

  </main>

  <script type="module">

    const publicKey =
      import.meta.env.VITE_VAPI_PUBLIC_KEY;

    const assistantId =
      import.meta.env.VITE_VAPI_ASSISTANT_ID;

    const widget =
      document.querySelector("vapi-widget");

    widget.setAttribute(
      "public-key",
      publicKey
    );

    widget.setAttribute(
      "assistant-id",
      assistantId
    );

  </script>

  <script
    src="https://unpkg.com/@vapi-ai/client-sdk-react/dist/embed/widget.umd.js"
    async
    type="text/javascript">
  </script>

</body>

</html>
